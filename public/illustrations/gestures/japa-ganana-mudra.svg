<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <title>Japa-gaṇanā mudrā</title>
  <g fill="none" stroke="#2A1E17" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(60,92) rotate(4) scale(0.92)">
      <!-- palm -->
      <rect x="-17" y="-30" width="34" height="28" rx="13"/>
      <!-- little finger -->
      <g transform="rotate(-14 -12 -30)"><rect x="-16" y="-56" width="8" height="27" rx="4"/></g>
      <!-- ring finger -->
      <g transform="rotate(-5 -4 -30)"><rect x="-8" y="-61" width="8" height="32" rx="4"/></g>
      <!-- middle finger -->
      <g transform="rotate(5 4 -30)"><rect x="0" y="-63" width="8" height="34" rx="4"/></g>
      <!-- index finger, folded short: not used for counting -->
      <g transform="rotate(38 12 -30)"><rect x="8" y="-40" width="8" height="12" rx="4"/></g>
      <!-- thumb, reaching across toward the ring finger -->
      <g transform="rotate(-96 -12 -12)"><rect x="-12" y="-17" width="19" height="9" rx="4.5"/></g>
    </g>
  </g>
  <!-- marker at the counted joint the thumb touches -->
  <circle cx="49" cy="60" r="2.2" fill="#2A1E17" stroke="none"/>
</svg>
