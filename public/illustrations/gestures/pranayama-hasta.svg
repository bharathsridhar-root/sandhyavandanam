<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <title>Prāṇāyāma hasta</title>
  <g fill="none" stroke="#2A1E17" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- nose reference line, face-free -->
    <path d="M64,26 L64,54" opacity="0.3"/>
    <path d="M60,54 Q64,60 68,54" opacity="0.3"/>

    <!-- right hand raised beside the nose, thumb and ring finger closing the nostrils -->
    <g transform="translate(66,58) rotate(4) scale(0.62)">
      <rect x="-17" y="-30" width="34" height="28" rx="13"/>
      <g transform="rotate(-14 -12 -30)"><rect x="-16" y="-56" width="8" height="27" rx="4"/></g>
      <g transform="rotate(-5 -4 -30)"><rect x="-8" y="-61" width="8" height="32" rx="4"/></g>
      <g transform="rotate(14 12 -30)"><rect x="8" y="-59" width="8" height="30" rx="4"/></g>
      <g transform="rotate(-42 17 -14)"><rect x="17" y="-19" width="22" height="10" rx="5"/></g>
    </g>

    <!-- left hand resting open, palm up, on the left knee -->
    <g transform="translate(34,102) rotate(90) scale(0.5)">
      <rect x="-17" y="-30" width="34" height="28" rx="13"/>
      <g transform="rotate(-14 -12 -30)"><rect x="-16" y="-56" width="8" height="27" rx="4"/></g>
      <g transform="rotate(-5 -4 -30)"><rect x="-8" y="-61" width="8" height="32" rx="4"/></g>
      <g transform="rotate(5 4 -30)"><rect x="0" y="-63" width="8" height="34" rx="4"/></g>
      <g transform="rotate(14 12 -30)"><rect x="8" y="-59" width="8" height="30" rx="4"/></g>
      <g transform="rotate(-42 17 -14)"><rect x="17" y="-19" width="22" height="10" rx="5"/></g>
    </g>
    <path d="M18,110 C28,116 42,116 52,110" opacity="0.3"/>
  </g>
</svg>
