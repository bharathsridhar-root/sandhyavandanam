<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <title>Diś-namaskāra mudrā</title>
  <g fill="none" stroke="#2A1E17" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <circle cx="64" cy="70" r="50" stroke-dasharray="1 7"/>
    <line x1="64" y1="20" x2="64" y2="10"/>
    <line x1="64" y1="120" x2="64" y2="130"/>
    <line x1="14" y1="70" x2="4" y2="70"/>
    <line x1="114" y1="70" x2="124" y2="70"/>
