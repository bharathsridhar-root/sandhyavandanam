<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <title>Añjali mudrā, raised overhead</title>
  <g fill="none" stroke="#2A1E17" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- torso and raised arms, face-free -->
    <path d="M48,112 C46,90 46,72 50,58 M80,112 C82,90 82,72 78,58" opacity="0.35"/>
    <path d="M50,58 C54,44 60,32 64,24" opacity="0.5"/>
    <path d="M78,58 C74,44 68,32 64,24" opacity="0.5"/>

    <!-- two palms pressed together above the head -->
    <g transform="translate(64,20) rotate(0)">
      <g transform="translate(-6,0) rotate(-8)">
        <path d="M-8,12 C-10,2 -8,-8 -4,-15 C-2,-18 1,-18 2,-15 C3,-12 3,-8 3,-4 L3,14 C3,17 -1,19 -4,18 C-6,17 -8,15 -8,12 Z"/>
      </g>
      <g transform="translate(6,0) scale(-1,1) rotate(-8)">
        <path d="M-8,12 C-10,2 -8,-8 -4,-15 C-2,-18 1,-18 2,-15 C3,-12 3,-8 3,-4 L3,14 C3,17 -1,19 -4,18 C-6,17 -8,15 -8,12 Z"/>
      </g>
    </g>
    <circle cx="64" cy="4" r="2" opacity="0.6"/>
  </g>
</svg>
